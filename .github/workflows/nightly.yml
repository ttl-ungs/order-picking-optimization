name: Nightly

# The slow suites that do not belong in a pull request: every stress test of the Hill Climbing /
# ACO models with a per-test cap, and the functional suites of the exact models (zimpl needed).
# Can also be started by hand (Actions -> Nightly -> Run workflow).
#
# A stress test that reaches the cap is reported as a timeout and does NOT fail the job (many
# stress instances are unsolvable by design); failures and errors do. opp_mono/opp_split's functional
# suites run here too (exact-zimpl job, zimpl installed via conda-forge) -- their stress suites
# are still skipped: most of their stress tests hit the per-test cap, which would push a
# single suite past this job's own budget.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      stress_timeout_minutes:
        description: "Per-test cap for stress tests, in minutes"
        default: "1"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  WRITE_RESULTS_CSV: "0"

jobs:
  stress-heuristics:
    name: All stress tests, HC and ACO models
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: >
          python -m scripts.run_all --tier stress --profile fast --jobs 2 --retries 1
          --stress-timeout-minutes ${{ inputs.stress_timeout_minutes || '1' }}
          --stress-suite-timeout 14000 --json stress-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-report
          path: stress-report.json

  exact-zimpl:
    name: Functional tests, exact models opp_mono/opp_split (needs zimpl)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # zimpl has no Ubuntu package (the old Debian one is gone); conda-forge maintains it as
      # part of the scipoptsuite feedstock. Installed into its own conda env and added to PATH
      # -- not activated -- so `python`/pip still resolve to setup-python's interpreter above
      # (the one with pyscipopt etc. from requirements.txt); solve_zpl only shells out to the
      # `zimpl` binary (tests/infra/zimpl/zpl_utils.py), it doesn't need a matching Python env.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          auto-update-conda: true
          auto-activate-base: false
      - name: Install zimpl (conda-forge)
        shell: bash -l {0}
        run: conda create -y -n zimpl-env zimpl
      - name: Put zimpl on PATH
        run: echo "$CONDA/envs/zimpl-env/bin" >> "$GITHUB_PATH"
      - run: zimpl --version
      # opp_split (64 tests) and opp_mono (63 tests): all but one converge; that one
      # (the feasible variant of case 30) hits the per-test cap, which run_all reports without
      # failing the suite. Each suite takes ~30 min on a laptop, most of it that cap.
      # --timeout is a per-suite ceiling (all its tests summed), not per test.
      - run: >
          python -m scripts.run_all --models opp_mono,opp_split --tier functional --jobs 2
          --timeout 3600 --json exact-zimpl-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exact-zimpl-report
          path: exact-zimpl-report.json
